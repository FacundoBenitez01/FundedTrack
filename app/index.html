<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="0;url=/">
<title>JourFund</title>
<script>
// The old /app/ copy was retired; drop its service worker and send people to the current app.
navigator.serviceWorker?.getRegistrations().then(rs=>rs.filter(r=>new URL(r.scope).pathname.startsWith('/app/')).forEach(r=>r.unregister())).finally(()=>location.replace('/'));
</script>
</head>
<body>
<p>JourFund se mudó. <a href="/">Abrir JourFund</a></p>
</body>
</html>
